# Portainer — Docker Swarm stack (modo HTTP / --sse)
#
# Deploy: Portainer → Stacks → Add stack → Swarm → Web editor → colar este ficheiro.
# Defina variáveis de ambiente na UI da stack (ou use .env no deploy CLI).
#
# Não use container_name em Swarm. Para n8n na mesma overlay, anexe a rede
# l_pw2c_lightrag_mcp (attachable) ao stack do n8n ou use o routing mesh / Traefik.
#
# Exemplo de variáveis:
#   LIGHTRAG_SERVER_URL=https://lightrag.example.com
#   MCP_ALLOWED_LIGHTRAG_HOSTS=lightrag.example.com

version: "3.8"

services:
  l-pw2c-lightrag-mcp:
    image: node:22-alpine
    init: true
    environment:
      LIGHTRAG_SERVER_URL: ${LIGHTRAG_SERVER_URL:-http://lightrag:9621}
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      LIGHTRAG_TIMEOUT_MS: ${LIGHTRAG_TIMEOUT_MS:-120000}
      LIGHTRAG_WORKSPACE: ${LIGHTRAG_WORKSPACE:-}
      MCP_HTTP_PORT: "8000"
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_HEADER_OVERRIDES: ${MCP_HTTP_HEADER_OVERRIDES:-true}
      MCP_ALLOWED_LIGHTRAG_HOSTS: ${MCP_ALLOWED_LIGHTRAG_HOSTS:-*}
    command:
      - sh
      - -c
      - >-
        npm install -g "l-pw2c-lightrag-server-mcp@${PW2C_LIGHTRAG_MCP_VERSION:-1.2.0}"
        && exec l-pw2c-lightrag-server-mcp --sse
    ports:
      - target: 8000
        published: ${MCP_HTTP_PORT:-8000}
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:8000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
    networks:
      - l_pw2c_lightrag_mcp

networks:
  l_pw2c_lightrag_mcp:
    driver: overlay
    attachable: true
